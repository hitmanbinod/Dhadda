<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Dhadda</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#006A60">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<script>
/* Theme before first paint - no flash. */
(function(){try{var m=JSON.parse(localStorage.getItem('expense_meta_v1')||'{}');var t=m.themeMode||'system';var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=t==='system'?(d?'dark':'light'):t;}catch(e){document.documentElement.dataset.theme='light';}})();
</script>
</head>
<body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><use href="icons.svg#i-home"/></svg>
<div id="app"></div>
<script>if(new URLSearchParams(location.search).has('demo'))document.write('<scr'+'ipt src="demo-data.js"><\/scr'+'ipt>');</script>
<script src="config.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').then(reg => {
  reg.addEventListener('updatefound', () => {
    const w = reg.installing;
    if (!w) return;
    w.addEventListener('statechange', () => {
      if (w.state === 'installed' && navigator.serviceWorker.controller) {
        const t = document.createElement('div');
        t.className = 'toast';
        t.innerHTML = '<span>Update ready, reload</span><button onclick="location.reload()">Reload</button>';
        document.body.appendChild(t);
      }
    });
  });
}).catch(() => {});
</script>
</body>
</html>
