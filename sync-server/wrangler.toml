name = "dhadda-sync"
main = "src/index.js"
compatibility_date = "2026-11-22"

# No secrets in this file. The token is generated by /v1/vault and stored
# only as a SHA-256 hash in D1.
# ALLOWED_ORIGIN is intentionally NOT set here: production must set it via
# `wrangler deploy --var ALLOWED_ORIGIN:<pages-url>` after Pages is deployed.
# Local `wrangler dev` allows 127.0.0.1/localhost only.

[[d1_databases]]
binding = "DB"
database_name = "dhadda-vault"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
