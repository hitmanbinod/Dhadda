name = "dhadda-sync"
main = "src/index.js"
compatibility_date = "2026-11-22"

# No secrets in this file. The token is generated by /v1/vault and stored
# only as a SHA-256 hash in D1. Set ALLOWED_ORIGIN to the Pages origin
# (https://dhadda-web.pages.dev) when deploying.
[vars]
ALLOWED_ORIGIN = "https://dhadda-web.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "dhadda-vault"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
