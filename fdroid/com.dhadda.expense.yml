# F-Droid build metadata for Dhadda.
#
# Copy this file into your fork of fdroid/fdroiddata as:
#     metadata/com.dhadda.expense.yml
# then open a merge request against fdroid/fdroiddata. See docs/FDROID.md.
#
# Verified on this machine against a clean `git clone` of the commit below:
#   - fail-closed guard fires with no opt-in (correct)
#   - `flutter build apk --release --android-project-arg
#      "dhaddaAllowUnsignedRelease=true"` succeeds from a clean clone
#   - output is a genuinely UNSIGNED APK (F-Droid applies its own key)
#   - applicationId com.dhadda.expense, versionCode 3, versionName 1.4.0
#
# NOT yet verified: an actual `fdroid build` run inside F-Droid's container.

Categories:
  - Finance Manager
License: Apache-2.0
AuthorName: hitmanbinod
SourceCode: https://github.com/hitmanbinod/Dhadda
IssueTracker: https://github.com/hitmanbinod/Dhadda/issues
WebSite: https://github.com/hitmanbinod/Dhadda

RepoType: git
Repo: https://github.com/hitmanbinod/Dhadda.git

MaintainerNotes: |
  Dhadda is a minimal, offline-first, single-user expense tracker. No accounts,
  no cloud, no ads, no analytics, no telemetry of any kind. It talks to nothing
  on the internet: the only network use is user-initiated sync to a device on
  the user's own WiFi (or an optional self-hosted PC relay the user runs
  themselves).

  All direct and transitive dependencies are BSD/MIT/Apache licensed; see
  docs/FDROID.md in the source repo for the audited list. No Google Play
  Services, no Firebase, no proprietary SDKs. QR scanning uses flutter_zxing
  rather than ML Kit specifically to stay free of proprietary binaries.

  The optional SMS import (opt-in, off by default, permission-gated) reads the
  device inbox on-device only; no message content is ever transmitted.

  Build notes for reviewers:
  - The app is Flutter, pinned to Flutter 3.47.2 (see .fvmrc). The flutter
    srclib is checked out to that exact tag.
  - android/app/build.gradle.kts deliberately fails CLOSED on a release build
    with no signing material, so that a maintainer release can never silently
    ship a debug-signed APK. F-Droid signs the unsigned output itself, so the
    recipe passes the explicit `dhaddaAllowUnsignedRelease=true` opt-in. This
    is the documented dev path, not a weakening of the check.
  - assets/webapp/ is a committed Flutter web bundle used by the in-app
    "Show on PC" feature, which serves the tracker to a browser on the
    user's own WiFi. It is therefore required at runtime and cannot simply
    be dropped. It is generated by tool/build_embedded_web.dart with fixed
    flags (--release --no-tree-shake-icons --pwa-strategy none) and is
    deterministic; CI runs `dart tool/build_embedded_web.dart --check` and
    fails if the committed copy does not match pubspec.yaml. The bundle
    contains the CanvasKit and SkWasm engines that ship with the pinned
    Flutter SDK (BSD-3-Clause, part of Flutter itself, not a third-party
    dependency); the recipe scan-ignores it because fdroidserver's scanner
    rejects .wasm unconditionally.

Builds:
  - versionName: '1.4.0'
    versionCode: 3
    # Full commit hash, not a tag name, per F-Droid's build metadata reference.
    commit: 5047cc7b5458001f2666c7fd8ce4f4b7fd8d870e
    srclibs:
      - flutter@stable
    # Delete platform folders the scanner does not need. Note `web/` is removed
    # but `assets/webapp/` is kept: that is the embedded bundle, not the
    # standalone web build.
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
      - benchmark
      - docs
      - Chatgpt
      - integration_test
    prebuild:
      # Pin Flutter to the version in .fvmrc. The tag exists upstream; the
      # srclib is a clone of github.com/flutter/flutter. pushd/popd rather than
      # `git -C`, matching the convention used by other Flutter recipes in
      # fdroiddata.
      - pushd $$flutter$$
      - git checkout -f 3.47.2
      - popd
      # Keep the pub cache inside the scanned tree so F-Droid's scanner can
      # check the downloaded Dart packages for licence compliance.
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      # assets/webapp/ is a committed Flutter web bundle: the app serves it
      # over the LAN for the in-app "Show on PC" feature, so it cannot be
      # rebuilt away or dropped without changing app behaviour.
      #
      # It contains six CanvasKit/SkWasm .wasm engines (~34 MB) plus
      # AssetManifest.bin. fdroidserver's scanner treats .wasm as an
      # unconditional build-aborting error (scanner.py, since fdroidserver
      # 2.3.0) and any binary-looking .bin the same, so the build would fail
      # with "Can't build due to N errors while scanning".
      #
      # These are Flutter SDK build outputs, not third-party binaries:
      # tool/build_embedded_web.dart regenerates them deterministically and CI
      # fails if the committed copy drifts from pubspec.yaml
      # (`dart tool/build_embedded_web.dart --check`). See MaintainerNotes.
      #
      # One directory entry rather than per-file entries: scanignore matches
      # by string prefix, and a path that matches nothing is itself an error
      # ("Non-exist scanignore path").
      - assets/webapp
    scandelete:
      # Dart packages downloaded during prebuild. prebuild runs inside
      # prepare_source, before the scan, so this path exists by then.
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      # The opt-in is required because build.gradle.kts fails closed without
      # signing material. F-Droid signs the resulting unsigned APK itself.
      - $$flutter$$/bin/flutter build apk --release --android-project-arg "dhaddaAllowUnsignedRelease=true"
    output: build/app/outputs/flutter-apk/app-release.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
# Flutter keeps its version in pubspec.yaml as `name+buildNumber`.
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: '1.4.0'
CurrentVersionCode: 3
