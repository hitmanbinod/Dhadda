<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <!-- Studio Porcelain Background -->
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F7F5F0"/>
      <stop offset="100%" stop-color="#EAE5DC"/>
    </linearGradient>

    <!-- Crimson Cloth Cover -->
    <linearGradient id="crimsonCover" x1="10%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#E8303B"/>
      <stop offset="40%" stop-color="#C81924"/>
      <stop offset="100%" stop-color="#7A0C13"/>
    </linearGradient>

    <!-- Ivory Fore-Edge Pages -->
    <linearGradient id="ivoryPage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#E6DFD1"/>
    </linearGradient>

    <!-- Brushed Gold Page Edge -->
    <linearGradient id="goldPage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D48A"/>
      <stop offset="100%" stop-color="#C58F2E"/>
    </linearGradient>

    <!-- Soft Specular Top Rim -->
    <linearGradient id="rimHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Inset Shadow for D-Window -->
    <linearGradient id="insetShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1410" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1F1410" stop-opacity="0"/>
    </linearGradient>

    <!-- Clip Paths -->
    <clipPath id="goldClip">
      <path d="M 40,30 H 51 A 24,24 0 0,1 75,54 A 24,24 0 0,1 51,78 H 40 A 4,4 0 0,1 36,74 V 34 A 4,4 0 0,1 40,30 Z"/>
    </clipPath>
    <clipPath id="ivoryClip">
      <path d="M 37,30 H 48 A 24,24 0 0,1 72,54 A 24,24 0 0,1 48,78 H 37 A 4,4 0 0,1 33,74 V 34 A 4,4 0 0,1 37,30 Z"/>
    </clipPath>
    <clipPath id="dWindowClip">
      <path d="M 45,42 H 46 A 12,12 0 0,1 58,54 A 12,12 0 0,1 46,66 H 45 A 2.5,2.5 0 0,1 42.5,63.5 V 44.5 A 2.5,2.5 0 0,1 45,42 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="108" height="108" fill="url(#studioBg)"/>

  <!-- Soft Layered Ambient Studio Shadow -->
  <path d="M 34.5,30 H 51 A 24,24 0 0,1 75,54 A 24,24 0 0,1 51,78 H 34.5 A 4.5,4.5 0 0,1 30,73.5 V 34.5 A 4.5,4.5 0 0,1 34.5,30 Z"
        transform="translate(1.5, 3.5)" fill="#1F1410" fill-opacity="0.08"/>
  <path d="M 34.5,30 H 51 A 24,24 0 0,1 75,54 A 24,24 0 0,1 51,78 H 34.5 A 4.5,4.5 0 0,1 30,73.5 V 34.5 A 4.5,4.5 0 0,1 34.5,30 Z"
        transform="translate(0.5, 1.5)" fill="#1F1410" fill-opacity="0.12"/>

  <!-- Layer 1: Brushed Gold Back Page Edge -->
  <g>
    <path d="M 40,30 H 51 A 24,24 0 0,1 75,54 A 24,24 0 0,1 51,78 H 40 A 4,4 0 0,1 36,74 V 34 A 4,4 0 0,1 40,30 Z"
          fill="url(#goldPage)"/>
    <!-- Gold Edge Highlight -->
    <path d="M 40,30.5 H 51 A 23.5,23.5 0 0,1 74.5,54 A 23.5,23.5 0 0,1 51,77.5 H 40" 
          fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
  </g>

  <!-- Cast Shadow from Ivory onto Gold -->
  <g clip-path="url(#goldClip)">
    <path d="M 37,30 H 48 A 24,24 0 0,1 72,54 A 24,24 0 0,1 48,78 H 37 Z"
          transform="translate(1.5, 0.5)" fill="#3A2104" fill-opacity="0.25"/>
  </g>

  <!-- Layer 2: Ivory Middle Page Edge -->
  <g>
    <path d="M 37,30 H 48 A 24,24 0 0,1 72,54 A 24,24 0 0,1 48,78 H 37 A 4,4 0 0,1 33,74 V 34 A 4,4 0 0,1 37,30 Z"
          fill="url(#ivoryPage)"/>
    <!-- Ivory Edge Highlight -->
    <path d="M 37,30.5 H 48 A 23.5,23.5 0 0,1 71.5,54 A 23.5,23.5 0 0,1 48,77.5 H 37" 
          fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
  </g>

  <!-- Cast Shadow from Cover onto Ivory -->
  <g clip-path="url(#ivoryClip)">
    <path d="M 34,30 H 45 A 24,24 0 0,1 69,54 A 24,24 0 0,1 45,78 H 34 Z"
          transform="translate(1.8, 0.5)" fill="#2B100B" fill-opacity="0.28"/>
  </g>

  <!-- Layer 3: Sculpted Crimson Dhadda Cover ("D") -->
  <g>
    <path d="M 34,30 H 45 A 24,24 0 0,1 69,54 A 24,24 0 0,1 45,78 H 34 A 4,4 0 0,1 30,74 V 34 A 4,4 0 0,1 34,30 Z"
          fill="url(#crimsonCover)"/>
    
    <!-- Specular Rim Light on Cover Edge -->
    <path d="M 34,30.5 H 45 A 23.5,23.5 0 0,1 68.5,54 A 23.5,23.5 0 0,1 45,77.5 H 34 A 3.5,3.5 0 0,1 30.5,74 V 34 A 3.5,3.5 0 0,1 34,30.5 Z"
          fill="none" stroke="url(#rimHighlight)" stroke-width="1"/>
  </g>

  <!-- Debossed Spine Crease (Left Hinge) -->
  <g>
    <!-- Dark crease -->
    <line x1="35.5" y1="30.5" x2="35.5" y2="77.5" stroke="#4A060A" stroke-opacity="0.6" stroke-width="1.2"/>
    <!-- Soft highlight to give volume -->
    <line x1="36.8" y1="30.5" x2="36.8" y2="77.5" stroke="#FF8A8A" stroke-opacity="0.3" stroke-width="1"/>
  </g>

  <!-- Recessed D-Window (Ledger Interior) -->
  <g>
    <!-- Base inner tone -->
    <path d="M 45,42 H 46 A 12,12 0 0,1 58,54 A 12,12 0 0,1 46,66 H 45 A 2.5,2.5 0 0,1 42.5,63.5 V 44.5 A 2.5,2.5 0 0,1 45,42 Z" fill="#D5CBB9"/>
    
    <!-- Bright Recessed Paper Shifted Down-Right for Lip Shadow -->
    <g clip-path="url(#dWindowClip)">
      <!-- The paper itself -->
      <path d="M 45,42 H 46 A 12,12 0 0,1 58,54 A 12,12 0 0,1 46,66 H 45 A 2.5,2.5 0 0,1 42.5,63.5 V 44.5 A 2.5,2.5 0 0,1 45,42 Z"
            transform="translate(1.2, 1.2)" fill="#FCF9F2"/>
      
      <!-- Inset Shadow for Depth -->
      <rect x="40" y="40" width="20" height="28" fill="url(#insetShadow)"/>
      
      <!-- Subtle Ledger Hairline Rules -->
      <g stroke="#E3D9C8" stroke-width="0.8" stroke-linecap="round">
        <line x1="42" y1="48" x2="58" y2="48"/>
        <line x1="42" y1="54" x2="58" y2="54"/>
        <line x1="42" y1="60" x2="58" y2="60"/>
      </g>
      
      <!-- Clean Accounting Strokes -->
      <g stroke-linecap="round">
        <!-- Red Bar -->
        <rect x="45.2" y="46.2" width="9.2" height="2.4" rx="1.2" fill="#B91C1C"/>
        <!-- Orange Bar -->
        <rect x="45.2" y="52.2" width="6.8" height="2.4" rx="1.2" fill="#D97706"/>
        <!-- Grey/Brown Bar -->
        <rect x="45.2" y="58.2" width="4.4" height="2.0" rx="1.0" fill="#B8AEA0"/>
      </g>
    </g>
  </g>
</svg>
